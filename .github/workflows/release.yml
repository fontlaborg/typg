# GitHub release automation for typg (made by FontLab https://www.fontlab.com/)
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: Build Python wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux_2_28
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux_2_28
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hatch + hatch-vcs for version sync
        run: python -m pip install --upgrade pip hatch hatch-vcs maturin

      - name: Sync Cargo versions to git tag
        shell: bash
        run: ./publish.sh sync

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel
        uses: messense/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # Build from the workspace root so the `typg-core` path dependency
          # (../../core/typg-core) resolves inside the manylinux container;
          # wheels land in the workspace-level target/wheels.
          args: --release --features extension-module --manifest-path py/typg-python/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.target }}
          path: target/wheels/*.whl

  publish-pypi:
    name: Publish wheels to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: ${{ success() }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-crates:
    name: Publish crates to crates.io
    needs: build-wheels
    runs-on: ubuntu-latest
    # Job-level `if` cannot read secrets; set the repo variable PUBLISH_CRATES=true
    # (with the CARGO_REGISTRY_TOKEN secret) to publish crates.
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hatch + hatch-vcs for version sync
        run: python -m pip install --upgrade pip hatch hatch-vcs

      - name: Sync Cargo versions to git tag
        run: ./publish.sh sync

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: cargo

      - name: Publish typg-core
        run: cargo publish -p typg-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for registry
        run: sleep 10

      - name: Publish typg-cli
        run: cargo publish -p typg-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for registry
        run: sleep 10

      - name: Publish typg-python crate
        run: cargo publish -p typg-python --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub release
    needs:
      - build-wheels
      - publish-pypi
      - publish-crates
    # Release the built wheels even when a registry upload is skipped or fails.
    if: ${{ !cancelled() && needs.build-wheels.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: dist

      - name: Create release and attach wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
